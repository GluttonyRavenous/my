<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ravenous</title>
    <!-- خطوط مشوشة وقوية -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Metal+Mania&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('47076fcf14f4817c17c339dd5b6f363f.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            overflow: hidden;
            margin: 0;
            position: relative;
            font-family: 'Creepster', 'Metal Mania', cursive;
        }

        /* طبقة تعتيم */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
            padding: 20px;
            animation: fadeIn 2.5s ease-in-out;
        }

        /* ===== الاسم RAVENOUS محاط بالنجمة من جميع الجوانب ===== */
        .ravenous-wrapper {
            display: inline-block;
            position: relative;
            text-align: center;
            margin-bottom: 70px;
            padding: 20px 30px;
        }

        /* النجمة العلوية */
        .ravenous-wrapper::before {
            content: '⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆';
            display: block;
            font-size: 2rem;
            color: #8B0000;
            text-shadow: 0 0 20px rgba(139, 0, 0, 0.6);
            letter-spacing: 10px;
            margin-bottom: 15px;
            animation: starPulse 3s infinite alternate;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* النجمة السفلية */
        .ravenous-wrapper::after {
            content: '⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆ ⋆';
            display: block;
            font-size: 2rem;
            color: #8B0000;
            text-shadow: 0 0 20px rgba(139, 0, 0, 0.6);
            letter-spacing: 10px;
            margin-top: 15px;
            animation: starPulse 3s infinite alternate reverse;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* الاسم نفسه (محاط بنجوم جانبية) */
        .ravenous-title {
            font-family: 'Creepster', 'Metal Mania', cursive;
            font-size: 4.8rem;
            font-weight: 700;
            color: #8B0000;
            text-shadow: 0 0 40px rgba(139, 0, 0, 0.9), 0 0 80px rgba(139, 0, 0, 0.5), 0 0 120px rgba(139, 0, 0, 0.3);
            letter-spacing: 12px;
            text-transform: uppercase;
            display: inline-block;
            animation: ravenousPulse 2.8s infinite alternate ease-in-out;
            position: relative;
            padding: 0 20px;
            transform: skew(-3deg, -2deg); /* تشويه إضافي للخط */
        }

        /* نجوم جانبية (يمين ويسار) باستخدام pseudo-elements */
        .ravenous-title::before {
            content: '⋆';
            position: absolute;
            left: -40px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 3rem;
            color: #8B0000;
            text-shadow: 0 0 30px rgba(139, 0, 0, 0.8);
            animation: starPulse 2.5s infinite alternate;
        }

        .ravenous-title::after {
            content: '⋆';
            position: absolute;
            right: -40px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 3rem;
            color: #8B0000;
            text-shadow: 0 0 30px rgba(139, 0, 0, 0.8);
            animation: starPulse 2.5s infinite alternate reverse;
        }

        /* حركة النجوم */
        @keyframes starPulse {
            0% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        /* حركة نبض الاسم المشوهة */
        @keyframes ravenousPulse {
            0% { transform: skew(-3deg, -2deg) scale(1) rotate(-0.5deg); text-shadow: 0 0 30px rgba(139, 0, 0, 0.7); }
            50% { transform: skew(-1deg, 0deg) scale(1.03) rotate(0.5deg); text-shadow: 0 0 60px rgba(139, 0, 0, 0.9), 0 0 100px rgba(139, 0, 0, 0.5); }
            100% { transform: skew(-3deg, -2deg) scale(1) rotate(-0.5deg); text-shadow: 0 0 30px rgba(139, 0, 0, 0.7); }
        }

        /* ===== العبارة السفلية ===== */
        .haunting-wrapper {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 10px;
        }

        .haunting-text {
            font-family: 'Creepster', 'Metal Mania', cursive;
            font-size: 3rem;
            font-weight: 400;
            color: #B22222;
            text-shadow: 0 0 30px rgba(178, 34, 34, 0.8), 0 0 60px rgba(178, 34, 34, 0.4);
            letter-spacing: 6px;
            line-height: 1.4;
            text-transform: uppercase;
            display: inline-block;
            position: relative;
            animation: verticalFloat 3.5s infinite alternate ease-in-out;
            margin-top: 10px;
            transform: skew(-2deg, -1deg);
        }

        @keyframes verticalFloat {
            0% { transform: skew(-2deg, -1deg) translateY(-6px); }
            50% { transform: skew(-2deg, -1deg) translateY(14px); }
            100% { transform: skew(-2deg, -1deg) translateY(-6px); }
        }

        .cursor-blink {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #B22222;
            border-radius: 50%;
            margin-left: 8px;
            animation: blink 1.2s infinite step-end;
            vertical-align: middle;
        }

        /* ===== بقع الدم ===== */
        .blood-drops {
            position: absolute;
            bottom: -55px;
            left: 0;
            width: 100%;
            height: 60px;
            pointer-events: none;
            z-index: 2;
        }

        .blood-drop {
            position: absolute;
            width: 13px;
            height: 20px;
            background: #B22222;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            opacity: 0.6;
            animation: fallBlood 3.2s infinite alternate ease-in-out;
            filter: blur(0.5px);
            box-shadow: 0 0 12px rgba(178, 34, 34, 0.6);
        }

        .blood-drop:nth-child(1) { left: 5%; animation-delay: 0s; height: 24px; width: 15px; }
        .blood-drop:nth-child(2) { left: 18%; animation-delay: 0.6s; height: 16px; width: 10px; }
        .blood-drop:nth-child(3) { left: 32%; animation-delay: 1.1s; height: 22px; width: 14px; }
        .blood-drop:nth-child(4) { left: 48%; animation-delay: 1.7s; height: 14px; width: 9px; }
        .blood-drop:nth-child(5) { left: 62%; animation-delay: 0.9s; height: 26px; width: 17px; }
        .blood-drop:nth-child(6) { left: 78%; animation-delay: 1.4s; height: 18px; width: 12px; }
        .blood-drop:nth-child(7) { left: 92%; animation-delay: 0.4s; height: 15px; width: 10px; }

        @keyframes fallBlood {
            0% { transform: translateY(-12px) rotate(-45deg) scale(0.7); opacity: 0.2; }
            100% { transform: translateY(45px) rotate(-45deg) scale(1.3); opacity: 0.9; }
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* تنسيق الجوال */
        @media (max-width: 480px) {
            .ravenous-title {
                font-size: 2.8rem;
                letter-spacing: 6px;
                padding: 0 10px;
            }
            .ravenous-title::before,
            .ravenous-title::after {
                font-size: 2rem;
            }
            .ravenous-title::before { left: -30px; }
            .ravenous-title::after { right: -30px; }
            .ravenous-wrapper::before,
            .ravenous-wrapper::after {
                font-size: 1.2rem;
                letter-spacing: 5px;
                white-space: normal;
                word-wrap: break-word;
            }
            .haunting-text {
                font-size: 2.2rem;
                letter-spacing: 3px;
            }
            .blood-drop {
                width: 8px !important;
                height: 12px !important;
            }
            .blood-drops {
                bottom: -40px;
                height: 50px;
            }
            .ravenous-wrapper {
                margin-bottom: 50px;
                padding: 10px 5px;
            }
        }

        body {
            background-color: #080808;
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- الاسم محاط بالنجمة من جميع الجوانب -->
        <div class="ravenous-wrapper">
            <div class="ravenous-title">Ravenous</div>
        </div>

        <!-- العبارة السفلية -->
        <div class="haunting-wrapper">
            <div class="haunting-text">
                I'm here... <br> Do you see me?
                <span class="cursor-blink"></span>

                <!-- بقع الدم -->
                <div class="blood-drops">
                    <span class="blood-drop"></span>
                    <span class="blood-drop"></span>
                    <span class="blood-drop"></span>
                    <span class="blood-drop"></span>
                    <span class="blood-drop"></span>
                    <span class="blood-drop"></span>
                    <span class="blood-drop"></span>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
